<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  #107: Windows-family aliases for the headless container.

  Without this file the whole container resolves to ONE family: croscore
  (font-croscore) ships aliases only for the metric-exact trio
  Arial->Arimo, Times New Roman->Tinos, Courier New->Cousine; everything
  else (Verdana, Tahoma, Georgia, Consolas, ...) fell through to the
  generic default — a single Open Sans in the raw image, DejaVu after
  font-dejavu. A measureText probe then reads "one font family" for 50+
  Windows family names, which no real desktop does.

  Installed families (Alpine + vendored, see fonts/README.md):
    Arimo / Tinos / Cousine   croscore (Arial/Times/Courier metric clones)
    Carlito                   crosextra (Calibri metric clone, ships alias)
    Caladea, Selawik          vendored in fonts/ (Cambria / Segoe UI clones)
    Nimbus Roman / Sans / Mono PS, P052 (Palatino), Z003 (Gothic),
    Standard Symbols PS (Symbol), D050 (Bookman), C059 (Century)   font-urw-base35
    DejaVu Sans / Serif / Sans Mono                       font-dejavu

  The map below points each probed Windows family at its closest installed
  lookalike so that the top-30 desktop set resolves to ~13 distinct metric
  families (a plausible desktop spread) instead of 1. Families that share a
  lookalike intentionally share metrics — a real desktop's Arial/Arimo pair
  does too.
-->
<fontconfig>

  <!-- ============ generic family defaults (the Windows desktop look) ============
       Real Chrome on Windows resolves the CSS generic families to the
       system default (Tahoma-class sans / Times serif / Courier mono).
       Pin them to the metric-clone trio so default-font probe strings
       match Windows widths.
       NOTE: `fc-match sans-serif` / `fc-match monospace` do NOT show the pin
       (they lose to fontconfig's Helvetica->Arial / Nimbus Mono PS->Courier
       fallback chains and report Nimbus Sans / Nimbus Mono PS). That does not
       matter for fingerprinting: measureText in headless Chromium resolves
       sans-serif to Arimo widths, serif to Tinos, and monospace to
       Cousine/Nimbus Mono PS within 0.05px (verified in-image, #107). -->
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arimo</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Tinos</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Cousine</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>cursive</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>fantasy</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <!-- ============ sans-serif Windows families ============ -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Microsoft Sans Serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arimo</string></edit>
  </match>
  <!-- Verdana/Tahoma/Lucida/Trebuchet: no metric clone shipped; Nimbus Sans
       (Helvetica-metric) is the closest distinct sans installed. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Lucida Sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Lucida Sans Unicode</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Trebuchet MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Comic Sans MS</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Impact</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Franklin Gothic Medium</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Z003</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Century Gothic</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Z003</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Book Antiqua</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>P052</string></edit>
  </match>

  <!-- ============ serif Windows families ============ -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Georgia</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Roman</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Palatino Linotype</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>P052</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Garamond</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Tinos</string></edit>
  </match>

  <!-- ============ monospace Windows families ============ -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Consolas</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Mono PS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Andale Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Mono PS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Lucida Console</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Mono PS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cascadia Code</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Cousine</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cascadia Mono</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Cousine</string></edit>
  </match>

  <!-- ============ Calibri/Cambria/Segoe UI cluster ============
       Selawik weight caveat (measured in-image): Segoe UI Semibold/Semilight/
       Light/Black are prepended to the family "Selawik", but fontconfig does
       NOT weight-match within it here — every weight variant resolves to the
       Selawik Regular face (measureText: Segoe UI / Semibold / Light all give
       identical widths). On a real desktop the Segoe UI weights differ from
       Regular; the stage-1 probe absorbs this because it measures family
       metrics, but a stage-C measureText/widths mock must NOT assume one
       Segoe UI metric per family — it needs a per-weight table. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Candara</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Corbel</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria Math</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Semibold</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Semilight</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Light</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe UI Black</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe Print</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Segoe Script</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
  </match>

  <!-- ============ symbols / misc ============ -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Standard Symbols PS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Webdings</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

  <!-- ============ macOS profile coverage ============
       The BrowserProfile can also claim MacIntel; keep the Mac staples
       resolving to distinct installed metrics as well. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Menlo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Monaco</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Lucida Grande</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Nimbus Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Apple SD Gothic Neo</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>DejaVu Sans</string></edit>
  </match>

</fontconfig>
