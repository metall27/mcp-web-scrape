services:
  mcp-web-scrape:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build metadata injected via -ldflags (#63). ${VAR:-default} syntax
        # means `docker compose build` works without any manual export:
        # GIT_SHA falls back to "unknown" when not in a git checkout / shell.
        # `make docker-compose-up` (and -build) export the real short SHA +
        # UTC build date automatically, so the canonical workflow is stamped:
        #   make docker-compose-build   # or: make docker-compose-up
        # Override ad hoc: GIT_SHA=abc1234 docker compose build
        VERSION: ${MCP_VERSION:-1.1.0}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Тегируем только коротким SHA коммита (#63). При сборке через ./dc
    # (или make docker-compose-*) GIT_SHA экспортируется автоматически,
    # поэтому образ получает тег mcp-web-scrape:<sha>. Без экспорта
    # (голый `docker compose`) fallback на :latest — чтобы build не падал.
    image: mcp-web-scrape:${GIT_SHA:-latest}
    container_name: mcp-web-scrape

    # Restart policy
    restart: unless-stopped

    # Порты
    ports:
      - "8192:8192"    # MCP endpoint & HTTP server

    # Переменные окружения
    environment:
      - MCP_WEB_SCRAPE_LOG_LEVEL=info
      - MCP_WEB_SCRAPE_SERVER_HOST=0.0.0.0
      - MCP_WEB_SCRAPE_SERVER_PORT=8192
      - MCP_WEB_SCRAPE_BROWSER_ENABLED=true
      - MCP_WEB_SCRAPE_BROWSER_HEADLESS=true
      - MCP_WEB_SCRAPE_BROWSER_NO_SANDBOX=true
      - MCP_WEB_SCRAPE_RATE_LIMIT_ENABLED=true
      - MCP_WEB_SCRAPE_CACHE_ENABLED=true
      - TZ=Europe/Moscow

    # Volumes
    volumes:
      # Конфигурация (read-only)
      - ./config.yaml:/app/config.yaml:ro
      # Cache directory
      - mcp-cache:/app/cache
      # Site method learning data
      - ./data:/app/data
      # Chrome shared memory (критично для headless Chrome)
      - chrome-shm:/dev/shm

    # Shared memory size (КРИТИЧНО для Chrome!)
    shm_size: '256mb'

    # Health check
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8192/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Resource limits (оптимизировано для Chrome + Go)
    deploy:
      resources:
        limits:
          cpus: '4.0'           # Max 4 CPU cores
          memory: 4G            # Max 4GB RAM
        reservations:
          cpus: '1.0'           # Гарантируем 1.0 CPU cores
          memory: 1G            # Гарантируем 1GB RAM

    # Security options
    security_opt:
      - no-new-privileges:true

    # Ulimits (system resource limits)
    ulimits:
      nproc: 512                 # Max processes
      nofile:
        soft: 4096              # Soft limit open files
        hard: 8192              # Hard limit open files

    # DNS settings
    dns:
      - 8.8.8.8                  # Google DNS
      - 8.8.4.4                  # Google DNS backup

    # Networks
    networks:
      - mcp-network

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels
    labels:
      - "com.mcp-web-scrape.version=${MCP_VERSION:-1.1.0}"
      - "com.mcp-web-scrape.git-sha=${GIT_SHA:-unknown}"
      - "com.mcp-web-scrape.phase=5-complete"
      - "com.mcp-web-scrape.site-method-learning=true"
      - "com.mcp-web-scrape.production-ready=true"

volumes:
  mcp-cache:
    driver: local
  chrome-shm:
    driver: local
  site-methods-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
